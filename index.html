<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>FIX Wealth Tracker</title>
    <link rel="icon" type="image/svg+xml" href="/src/assets/fix-wealth-logo.svg" />
    <meta name="description" content="Comprehensive personal finance, wealth, net worth, and cash flow tracker with dual mobile and desktop responsive views." />
    <meta property="og:title" content="FIX Wealth Tracker" />
    <meta property="og:description" content="Comprehensive personal finance, wealth, net worth, and cash flow tracker with dual mobile and desktop responsive views." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          var userExplicit = localStorage.getItem('user_explicit_theme');
          var t = (userExplicit && localStorage.getItem('aura_theme')) || 'dark';
          document.documentElement.setAttribute('data-theme', t);
          document.documentElement.classList.add(t + '-theme');
          if (t !== 'light' && t !== 'nature' && t !== 'retro') {
            document.documentElement.classList.add('dark');
          }
          if (t === 'dark' || t === 'midnight') {
            document.documentElement.classList.add('dark-theme');
          }
          if (t === 'midnight') {
            document.documentElement.classList.add('midnight-theme');
          }
          var acc = localStorage.getItem('fix_accent_color') || 'blue';
          document.documentElement.setAttribute('data-accent', acc);
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-zinc-950 text-zinc-100 antialiased selection:bg-emerald-500 selection:text-white font-['Plus_Jakarta_Sans',sans-serif]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
