<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>FIX Wealth Tracker</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#2563eb" />
    <meta name="application-name" content="FIX Wealth Tracker" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="FIX Wealth" />
    <meta name="description" content="Comprehensive personal finance, wealth, net worth, and cash flow tracker with dual mobile and desktop responsive views." />
    
    <!-- OpenGraph Social Tags -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="FIX Wealth Tracker" />
    <meta property="og:title" content="FIX Wealth Tracker" />
    <meta property="og:description" content="Comprehensive personal finance, wealth, net worth, and cash flow tracker with dual mobile and desktop responsive views." />
    <meta property="og:image" content="/favicon.svg" />

    <!-- Twitter Card Tags -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="FIX Wealth Tracker" />
    <meta name="twitter:description" content="Comprehensive personal finance, wealth, net worth, and cash flow tracker with dual mobile and desktop responsive views." />
    <meta name="twitter:image" content="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Cinzel:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&family=Orbitron:wght@400;500;600;700;800;900&family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,800;0,900;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Roboto:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          var hasUser = localStorage.getItem('aura_auth_user_v2');
          if (hasUser) {
            var userExplicit = localStorage.getItem('user_explicit_theme');
            var t = (userExplicit && localStorage.getItem('aura_theme')) || 'dark';
            document.documentElement.setAttribute('data-theme', t);
            document.documentElement.classList.add(t + '-theme');
            if (t !== 'light' && t !== 'nature' && t !== 'retro') {
              document.documentElement.classList.add('dark');
            }
            if (t === 'dark' || t === 'midnight') {
              document.documentElement.classList.add('dark-theme');
            }
            if (t === 'midnight') {
              document.documentElement.classList.add('midnight-theme');
            }
          } else {
            // Landing page default is strictly white light theme
            document.documentElement.setAttribute('data-theme', 'light');
            document.documentElement.classList.add('light-theme');
          }
          var acc = localStorage.getItem('fix_accent_color') || 'blue';
          document.documentElement.setAttribute('data-accent', acc);

          // Apply saved typography font family
          var f = localStorage.getItem('fix_appearance_font_family') || 'plus_jakarta';
          var fontMap = {
            'plus_jakarta': "'Plus Jakarta Sans', sans-serif",
            'roboto': "'Roboto', sans-serif",
            'bungee': "'Bungee', cursive, sans-serif",
            'playfair': "'Playfair Display', Georgia, serif",
            'cinzel': "'Cinzel', serif",
            'orbitron': "'Orbitron', sans-serif"
          };
          if (fontMap[f]) {
            document.documentElement.style.setProperty('--app-font-family', fontMap[f]);
            document.documentElement.setAttribute('data-font', f);
          }
        } catch (e) {}
      })();
    </script>
  <body class="bg-slate-50 text-slate-900 antialiased selection:bg-emerald-500 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
